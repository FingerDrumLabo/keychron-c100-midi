name: ファームウェアをビルド

# push のたびに GitHub 側でビルドする。
# 配布している .bin が「公開されているソースから作られたもの」だと
# 誰でも確認できるようにするのが目的。
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: QMK Userspace Build
    uses: qmk/.github/.github/workflows/qmk_userspace_build.yml@main
    with:
      qmk_repo: Keychron/qmk_firmware
      qmk_ref: 2025q3

  # QMK公式の publish ワークフローはリポジトリもチェックアウトして
  # **/*.bin を拾うため、firmware/ に置いてある配布用のファイルまで
  # リリースに混ざってしまう。ここでビルド成果物だけを公開する。
  publish:
    name: リリースを更新
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: ビルド結果を取得
        uses: actions/download-artifact@v8
        with:
          name: Firmware
          path: out

      - name: 中身を確認
        run: |
          ls -l out
          sha256sum out/*.bin

      - name: リリースを差し替え
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ github.token }}
          name: Latest QMK Firmware
          tag_name: latest
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          body: |
            `main` の最新コミットから GitHub Actions がビルドしたファームウェアです。

            - ソース: `keyboards/keychron/c100_8k/keymaps/midi/`
            - ベース: Keychron/qmk_firmware `2025q3`
            - ビルドしたコミット: ${{ github.sha }}

            QMK はビルド日時をファームウェアに埋め込むため、
            ビルドするたびにハッシュは変わります。同じ内容でも一致しません。
          files: out/*.bin
