name: ファームウェアをビルド

# push のたびに GitHub 側でビルドする。
# 配布している .bin が「公開されているソースから作られたもの」だと
# 誰でも確認できるようにするのが目的。
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: QMK Userspace Build
    uses: qmk/.github/.github/workflows/qmk_userspace_build.yml@main
    with:
      qmk_repo: Keychron/qmk_firmware
      qmk_ref: 2025q3

  publish:
    name: QMK Userspace Publish
    if: always() && !cancelled()
    needs: build
    uses: qmk/.github/.github/workflows/qmk_userspace_publish.yml@main
